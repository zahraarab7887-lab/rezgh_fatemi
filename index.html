<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10291f">
<title>رزق فاطمی</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --green: #10291f;
  --green-light: #1d4231;
  --cream: #f2ead8;
  --gold: #c5a875;
  --muted: #c3c0ad;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--green);
  color: var(--cream);
  font-family: 'Vazirmatn', sans-serif;
}

.page {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  padding: 38px 6%;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 25% 50%, rgba(72,110,75,.18), transparent 55%),
    linear-gradient(135deg, #0c2119, #173a2a 55%, #10291f);
}

/* زمینه ظریف و بدون نقش‌های شلوغ */
.page:before {
  content: "";
  position: absolute;
  inset: 17px;
  border: 1px solid rgba(197,168,117,.25);
  pointer-events: none;
}

.page:after {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border: 1px solid rgba(197,168,117,.07);
  border-radius: 50%;
  top: -310px;
  left: -150px;
  pointer-events: none;
}

.container {
  width: 100%;
  max-width: 1160px;
  position: relative;
  z-index: 1;
}

.bismillah {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: clamp(28px, 4vw, 40px);
  color: var(--gold);
  font-weight: 400;
  margin-bottom: 55px;
  animation: fade 1.5s ease both;
}

.bismillah-line {
  width: 100px;
  height: 1px;
  background: rgba(197,168,117,.6);
  margin: 18px auto 0;
}

.content {
  display: grid;
  grid-template-columns: 1fr .9fr;
  gap: 85px;
  align-items: center;
}

/* تصویر */
.portrait-area {
  display: flex;
  justify-content: center;
  animation: rise 1.3s ease both;
}

.portrait-frame {
  width: 100%;
  max-width: 420px;
  height: 555px;
  position: relative;
  padding: 9px;
  border: 1px solid rgba(197,168,117,.75);
  background: rgba(255,255,255,.025);
}

.portrait-frame:before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(197,168,117,.25);
  pointer-events: none;
  z-index: 2;
}

.portrait-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 62% center;
  display: block;
  filter: saturate(.78) contrast(1.04);
}

/* نوشته‌ها */
.text-area {
  text-align: center;
  animation: rise 1.3s .2s ease both;
}

.brand {
  font-size: clamp(54px, 7vw, 82px);
  font-weight: 700;
  letter-spacing: -4px;
  line-height: 1.5;
  color: var(--cream);
}

.brand-rule {
  width: 135px;
  height: 1px;
  background: var(--gold);
  margin: 16px auto 23px;
  opacity: .8;
}

.subtitle {
  color: var(--muted);
  font-size: 15px;
  line-height: 2.5;
  font-weight: 300;
  margin-bottom: 48px;
}

.quote-section {
  padding: 28px 0 30px;
  border-top: 1px solid rgba(197,168,117,.3);
  border-bottom: 1px solid rgba(197,168,117,.3);
  margin-bottom: 38px;
}

.quote {
  font-family: 'Amiri', serif;
  font-size: clamp(30px, 4vw, 43px);
  font-weight: 700;
  line-height: 2;
  color: var(--cream);
  opacity: 0;
  animation: quoteReveal 2s 1s ease forwards;
}

.author {
  color: var(--gold);
  font-size: 14px;
  font-weight: 400;
  margin-top: 15px;
}

.enter {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 225px;
  padding: 16px 30px;
  border: 1px solid var(--gold);
  color: var(--cream);
  text-decoration: none;
  font-size: 15px;
  font-weight: 400;
  transition: .4s ease;
  background: transparent;
}

.enter:hover {
  background: var(--gold);
  color: var(--green);
  box-shadow: 0 8px 35px rgba(197,168,117,.15);
  transform: translateY(-3px);
}
  .footer {
  text-align: center;
  margin-top: 60px;
  color: rgba(242,234,216,.5);
  font-family: 'Amiri', serif;
  font-size: 17px;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes quoteReveal {
  from {
    opacity: 0;
    transform: translateY(16px);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@media(max-width: 760px) {
  .page {
    padding: 38px 27px;
  }

  .bismillah {
    margin-bottom: 40px;
  }

  .content {
    grid-template-columns: 1fr;
    gap: 42px;
  }

  .text-area {
    order: 1;
  }

  .portrait-area {
    order: 2;
  }

  .brand {
    font-size: 61px;
  }

  .subtitle {
    margin-bottom: 32px;
  }

  .quote {
    font-size: 34px;
  }

  .portrait-frame {
    max-width: 330px;
    height: 440px;
  }

  .footer {
    margin-top: 45px;
  }
}

@media(max-width: 380px) {
  .brand {
    font-size: 52px;
  }

  .quote {
    font-size: 29px;
  }

  .portrait-frame {
    height: 390px;
  }
}
</style>
</head>

<body>

<main class="page">
  <div class="container">

    <header class="bismillah">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      <div class="bismillah-line"></div>
    </header>

    <section class="content">

      <div class="text-area">

        <h1 class="brand">رزق فاطمی</h1>

        <div class="brand-rule"></div>

        <p class="subtitle">
          ختم جمعی  صلوات
          <br>
          به مناسبت ایام فاطمیه
        </p>

        <div class="quote-section">
          <p class="quote">
            من رزق یک سال کشور را
            <br>
            در شب‌های فاطمیه می‌گیرم.
          </p>

          <div class="author">
            رهبر شهید
          </div>
        </div>

        <a class="enter" href="salavat.html">
          ورود به قرار صلوات
        </a>

      </div>

      <div class="portrait-area">
        <div class="portrait-frame">
          <img src="rahbar.jpg" alt="تصویر رهبر شهید">
        </div>
      </div>

    </section>

    <footer class="footer">
      به یاد شب‌های فاطمیه
    </footer>

  </div>
</main>

</body>
</html>
